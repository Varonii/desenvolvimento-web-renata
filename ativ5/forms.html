<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        /* formulário centralizado */
        form {
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
        }

        /* campos organizados: cada campo em um bloco */
        .campo {
            margin-bottom: 15px;
        }

        label,
        legend {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0 0 15px 0;
        }

        /* labels de radio e checkbox ficam ao lado da opção */
        .opcao {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        /* efeito ao focar */
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.6);
        }

        button {
            width: 100%;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        /* hover no botão */
        button:hover {
            background-color: #45a049;
        }

        /* responsividade */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            form {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <h1>Formulário</h1>

    <form action="#" method="post">

        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="campo">
            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div class="campo">
            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecione um curso</option>
                <option value="informatica">Informática</option>
                <option value="matematica">Matemática</option>
                <option value="fisica">Física</option>
                <option value="quimica">Química</option>
            </select>
        </div>

        <fieldset>
            <legend>Sexo:</legend>
            <label class="opcao" for="masculino">
                <input type="radio" id="masculino" name="sexo" value="masculino" required> Masculino
            </label>
            <label class="opcao" for="feminino">
                <input type="radio" id="feminino" name="sexo" value="feminino"> Feminino
            </label>
        </fieldset>

        <fieldset>
            <legend>Interesses:</legend>
            <label class="opcao" for="int-programacao">
                <input type="checkbox" id="int-programacao" name="interesses" value="programacao"> Programação
            </label>
            <label class="opcao" for="int-jogos">
                <input type="checkbox" id="int-jogos" name="interesses" value="jogos"> Jogos
            </label>
            <label class="opcao" for="int-musica">
                <input type="checkbox" id="int-musica" name="interesses" value="musica"> Música
            </label>
            <label class="opcao" for="int-esportes">
                <input type="checkbox" id="int-esportes" name="interesses" value="esportes"> Esportes
            </label>
        </fieldset>

        <div class="campo">
            <label for="comentarios">Comentários:</label>
            <textarea id="comentarios" name="comentarios" rows="4"></textarea>
        </div>

        <div class="campo">
            <label for="foto">Upload de foto:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
